name: Run Katalon On BitBar

on:
  workflow_dispatch: {}

jobs:
  run-tests:
    runs-on: ubuntu-latest

    env:
      # Secrets (GitHub Actions Secrets)
      AAF_EMAIL: ${{ secrets.AAF_EMAIL }}
      AAF_PASSWORD: ${{ secrets.AAF_PASSWORD }}
      KATALON_API_KEY: ${{secrets.KATALON_API_KEY}}

      # Non-sensitive configuration
      AAF_BASE_URL: "https://corp-aaf-ng-ui-qa01.shd-rosa-test-cc.awscpggpc.ca"
      GRAPH_MAILBOX_UPN: "SF_AAF_No-Reply_NP@canadapost.postescanada.ca"

      # KRE folder after extraction
      KATALON_FOLDER: "KRE"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java Installation
        run: java -version

      - name: Run Katalon Test Suite
        uses: Katalon-studio/Katalon-studio-github-action@v4.0
        with:
         version: '11.4.0'
         projectPath: '${{github.workspace}}'
         args: >
            -noSplash \
            -runMode=console \
            -projectPath="$(pwd)/Bitbar_Katalon_SetUp.prj" \
            -retry=0 \
            -testSuitePath="Test Suites/Bitbar_Test_Suite" \
            -executionProfile="default" \
            -browserType="cbt-chrome" \
            -apiKey="${{secrets.API_KEY}}"

      - name: Upload Run Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katalon-run-results
          path: |
            Reports/
            Downloads/
            ActualJSON/
            ComparisonResults/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Final Consolidated HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-report
          path: ComparisonResults/Consolidated_Report.html
          if-no-files-found: warn
          retention-days: 14
