name: Run Katalon On BitBar

on:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    env:
      # Secrets (GitHub Actions Secrets)
      AAF_EMAIL: ${{ secrets.AAF_EMAIL }}
      AAF_PASSWORD: ${{ secrets.AAF_PASSWORD }}
      KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}

      # Non-sensitive configuration
      AAF_BASE_URL: "https://corp-aaf-ng-ui-qa01.shd-rosa-test-cc.awscpggpc.ca"
      GRAPH_MAILBOX_UPN: "SF_AAF_No-Reply_NP@canadapost.postescanada.ca"

      # KRE folder after extraction
      KATALON_FOLDER: "KRE"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java Installation
        run: java -version

      - name: Download Katalon Runtime Engine
        run: |
          mkdir -p ${KATALON_FOLDER}

          wget -O katalon.zip \
          "https://download.katalon.com/10.4.1/Katalon_Studio_Engine_Linux_64-10.4.1.zip"

          unzip -q katalon.zip -d ${KATALON_FOLDER}

          echo "KRE downloaded and extracted."

      - name: Set KRE Executable Permissions
        run: |
          chmod -R +x ${KATALON_FOLDER}
          find ${KATALON_FOLDER} -type f -name "katalonc*" -exec chmod +x {} \;

      - name: Verify KRE Installation
        run: |
          ls -la ${KATALON_FOLDER}
          find ${KATALON_FOLDER} -name "katalonc*"

      - name: Smoke Test - Verify Katalon Can Launch
        run: |
          KATALON_EXEC=$(find ${KATALON_FOLDER} -type f -name "katalonc*" | head -n 1)
          echo "Using executable: $KATALON_EXEC"
          $KATALON_EXEC -version

      - name: Run Katalon Test Suite
        run: |
          set -e

          KATALON_EXEC=$(find ${KATALON_FOLDER} -type f -name "katalonc*" | head -n 1)

          $KATALON_EXEC \
            -noSplash \
            -runMode=console \
            -projectPath="$(pwd)/Bitbar_Katalon_SetUp.prj" \
            -retry=0 \
            -testSuitePath="Test Suites/Bitbar_Test_Suite" \
            -executionProfile="QA" \
            -browserType="Chrome Headless" \
            -apiKey="${{ secrets.KATALON_API_KEY }}"

      - name: Upload Run Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katalon-run-results
          path: |
            Reports/
            Downloads/
            ActualJSON/
            ComparisonResults/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Final Consolidated HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-report
          path: ComparisonResults/Consolidated_Report.html
          if-no-files-found: warn
          retention-days: 14
